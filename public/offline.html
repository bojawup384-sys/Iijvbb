<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#08100d" />
    <title>برق — غير متصل</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08100d;
        color: #e3ddd0;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 380px; }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 22px;
        border-radius: 15px;
        display: grid; place-items: center;
        font-size: 40px; font-weight: 700; line-height: 1;
        color: #faf4e6;
        background: #168257;
      }
      h1 { font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #faf7f1; }
      p { color: #a39b8b; line-height: 1.9; margin-bottom: 26px; }
      button {
        border: none; cursor: pointer;
        padding: 12px 28px; border-radius: 10px;
        font: inherit; font-weight: 600; font-size: 15px; color: #fff;
        background: #168257;
      }
      button:hover { background: #1a9467; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">ب</div>
      <h1>أنت غير متصل</h1>
      <p>ما كاش إنترنت حاليًا. تحقق من الشبكة وأعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
